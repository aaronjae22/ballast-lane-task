# Local stack: docker compose up --build
# Runs without a .env file. .env.example documents the overrides compose reads.
# Worker, beat (iteration 4) and frontend (iteration 5) services come later.

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskboard}
      POSTGRES_USER: ${POSTGRES_USER:-taskboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskboard}
    # Published for host-side tests; 5433 avoids clashing with a local Postgres.
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    environment:
      # The local stack runs with DEBUG on, so the built-in secret key is accepted.
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_TIME_ZONE: ${DJANGO_TIME_ZONE:-UTC}
      # Fixed to the compose services, so a host-oriented .env can't redirect them.
      DATABASE_URL: postgres://${POSTGRES_USER:-taskboard}:${POSTGRES_PASSWORD:-taskboard}@db:5432/${POSTGRES_DB:-taskboard}
      REDIS_URL: redis://redis:6379/0
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI: http://localhost:8025

volumes:
  pgdata:

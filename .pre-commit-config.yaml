# Run everything: uv run --project backend pre-commit run --all-files
# Python tools run as local hooks through uv, so pre-commit, the editor and CI
# all use the versions pinned in backend/uv.lock (ADR 0008).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
        # Keep Markdown hard line breaks (two trailing spaces).
        args: [--markdown-linebreak-ext=md]
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  # Downloads the hadolint binary into pre-commit's own environment, so it runs
  # the same locally and in CI without Docker or a system install.
  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.15.1
    hooks:
      - id: hadolint

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        # --project keeps the working directory at the repo root, so the
        # file paths pre-commit passes still resolve. From the root, ruff only
        # honors force-exclude as a CLI flag, so it's passed here too.
        entry: uv run --project backend ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        files: ^backend/
      - id: ruff-format
        name: ruff format
        entry: uv run --project backend ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        files: ^backend/
      - id: uv-lock-check
        name: uv lock --check
        entry: uv lock --check --directory backend
        language: system
        files: ^backend/(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: lint-imports
        name: lint-imports
        # --directory: import-linter reads its config and finds the tasks package
        # from the working directory.
        entry: uv run --directory backend lint-imports
        language: system
        files: ^backend/(.*\.py|pyproject\.toml)$
        pass_filenames: false
      # Frontend tools run from frontend/node_modules (npm ci there first), so pre-commit,
      # the editor and CI use the versions in package-lock.json, as the uv hooks do.
      # ESLint finds frontend/eslint.config.js from each file's directory. Prettier finds its
      # config the same way, but reads an ignore file only from the working directory, so
      # it's named here.
      - id: eslint
        name: eslint (frontend)
        entry: frontend/node_modules/.bin/eslint --fix --max-warnings=0
        language: system
        types_or: [ts, tsx, javascript]
        files: ^frontend/
      - id: prettier
        name: prettier (frontend)
        entry: frontend/node_modules/.bin/prettier --write --ignore-unknown --ignore-path frontend/.prettierignore
        language: system
        types: [text]
        files: ^frontend/

name: CI

# Push only on main: pull_request already covers branch updates, so PRs run once.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: taskboard
          POSTGRES_USER: taskboard
          POSTGRES_PASSWORD: taskboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskboard -d taskboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Set explicitly: the settings default points at the compose db's host port (5433).
    env:
      DATABASE_URL: postgres://taskboard:taskboard@localhost:5432/taskboard
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # setup-uv publishes only full version tags, so it's pinned by commit SHA.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check architecture contracts
        run: uv run lint-imports

      - name: Test with coverage gate
        run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build the backend prod image
        run: docker build --target prod --tag taskboard-backend:ci backend/

      # spec section 13: "docker compose up --build serves /api/health/". --wait
      # fails if a container exits, e.g. when the entrypoint's migrate fails.
      - name: Start the compose stack
        run: docker compose up --build --detach --wait --wait-timeout 180

      - name: Check that /api/health/ is ok
        run: |
          body=$(curl --fail --silent --show-error --retry 10 --retry-connrefused \
            --retry-delay 3 http://localhost:8000/api/health/)
          echo "$body"
          test "$body" = '{"status":"ok"}'

      - name: Check that the entrypoint applied every migration
        run: docker compose exec -T backend python manage.py migrate --check

      - name: Show compose logs
        if: failure()
        run: docker compose logs

      - name: Stop the compose stack
        if: always()
        run: docker compose down --volumes

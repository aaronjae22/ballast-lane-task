name: CI

# Push only on main: pull_request already covers branch updates, so PRs run once.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: taskboard
          POSTGRES_USER: taskboard
          POSTGRES_PASSWORD: taskboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskboard -d taskboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Set explicitly: the settings default points at the compose db's host port (5433).
    env:
      DATABASE_URL: postgres://taskboard:taskboard@localhost:5432/taskboard
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # setup-uv publishes only full version tags, so it's pinned by commit SHA.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check architecture contracts
        run: uv run lint-imports

      - name: Test with coverage gate
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The Node version comes from .nvmrc, the same pin as local development (ADR 0016).
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # ESLint with type information, then Prettier's check.
      - name: Lint and check formatting
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # The frontend's API contract (ADR 0016): the committed schema and types in
  # frontend/src/api/generated/ must be exactly what the backend and openapi-typescript give.
  # Fails on a backend change without npm run gen:api, a hand edit, or a generator upgrade.
  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: uv.lock

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # gen:schema sets DEBUG and a local cache itself: no database, Redis or secret needed.
      - name: Regenerate the schema and the types
        working-directory: frontend
        run: npm run gen:api

      - name: Check that the committed contract is current
        run: |
          changes=$(git status --porcelain -- frontend/src/api/generated/)
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff -- frontend/src/api/generated/
            echo "The generated API contract is stale: run npm run gen:api in frontend/ and commit it."
            exit 1
          fi
          echo "The generated API contract is current."

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build the backend prod image
        run: docker build --target prod --tag taskboard-backend:ci backend/

      # spec section 13: "docker compose up --build serves /api/health/". --wait
      # blocks until the backend's healthcheck passes, and fails if a container
      # exits (e.g. when the entrypoint's migrate fails).
      - name: Start the compose stack
        run: docker compose up --build --detach --wait --wait-timeout 180

      - name: Check that /api/health/ is ok
        run: |
          body=$(curl --fail --silent --show-error --retry 10 --retry-all-errors \
            --retry-delay 3 http://localhost:8000/api/health/)
          echo "$body"
          test "$body" = '{"status":"ok"}'

      - name: Check that the entrypoint applied every migration
        run: docker compose exec -T backend python manage.py migrate --check

      # spec section 13: "the seed runs twice without duplicates". The entrypoint ran it once.
      - name: Check that a second seed creates nothing
        run: |
          output=$(docker compose exec -T backend python manage.py seed_demo)
          echo "$output"
          test "$output" = "Created 0 users and 0 tasks."

      # Only the backend migrates (ADR 0015). migrate prints "Operations to perform".
      - name: Check that the worker and beat did not migrate
        run: |
          docker compose logs worker beat
          ! docker compose logs worker beat | grep -q "Operations to perform"

      # spec section 13: "assigning a task shows an email in Mailpit". Through the API, the
      # Celery notifier, Redis, the worker and SMTP, read back from Mailpit's API.
      - name: Check that an assignment email reaches Mailpit
        run: |
          api=http://localhost:8000/api
          token=$(curl --fail --silent --show-error -X POST "$api/auth/token/" \
            -H "Content-Type: application/json" \
            -d '{"username": "alice", "password": "demo-password"}' | jq -r .access)
          bob=$(curl --fail --silent --show-error "$api/users/" \
            -H "Authorization: Bearer $token" | jq '.[] | select(.name == "Bob Smith") | .id')
          curl --fail --silent --show-error -X POST "$api/tasks/" \
            -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
            -d "{\"title\": \"CI smoke assignment\", \"assignee_id\": $bob}"
          echo
          for _ in $(seq 30); do
            to=$(curl --fail --silent http://localhost:8025/api/v1/messages | jq -r \
              '.messages[] | select(.Subject | endswith("CI smoke assignment")) | .To[].Address')
            if [ "$to" = "bob@example.com" ]; then echo "Mailpit has it, to $to"; exit 0; fi
            sleep 2
          done
          echo "No assignment email for bob@example.com in Mailpit"; exit 1

      # The reminder, triggered by hand as Beat would. The seed gives alice, bob and carol an
      # open task due tomorrow, and each gets one digest.
      - name: Check that the due-tomorrow digests reach Mailpit
        run: |
          docker compose exec -T worker celery -A config call tasks.send_due_tomorrow_reminders
          expected="alice@example.com bob@example.com carol@example.com"
          for _ in $(seq 30); do
            to=$(curl --fail --silent http://localhost:8025/api/v1/messages | jq -r \
              '[.messages[] | select(.Subject | startswith("Due tomorrow")) | .To[].Address]
               | sort | join(" ")')
            if [ "$to" = "$expected" ]; then echo "Mailpit has digests for $to"; exit 0; fi
            sleep 2
          done
          echo "Expected digests for $expected, found: $to"; exit 1

      - name: Show compose logs
        if: failure()
        run: docker compose logs

      - name: Stop the compose stack
        if: always()
        run: docker compose down --volumes

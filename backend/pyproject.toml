[project]
name = "taskboard-backend"
version = "0.1.0"
description = "Team Task Board: task management REST API (Django + DRF)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "celery[redis]>=5.7.0",
    "dj-database-url>=3.1.2",
    "django>=5.2.19,<5.3",
    "django-filter>=26.2",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "gunicorn>=27.0.0",
    "psycopg[binary]>=3.3.8",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "import-linter>=2.16",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.4",
]

[tool.uv]
# A Django project, not an installable package: uv manages the environment only.
package = false

[tool.ruff]
line-length = 100
# Django-generated migrations are not hand-edited, so they're not linted or formatted.
extend-exclude = ["**/migrations/*"]
# pre-commit passes file paths explicitly; without this, ruff ignores the excludes for them.
force-exclude = true

[tool.ruff.lint]
extend-select = ["E", "F", "W", "I", "B", "UP", "DJ", "SIM", "RUF"]

[tool.importlinter]
root_packages = ["tasks"]
# Needed so contracts can name third-party packages (django, rest_framework, celery).
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain imports nothing from Django, DRF or Celery"
type = "forbidden"
source_modules = ["tasks.domain"]
forbidden_modules = ["django", "rest_framework", "celery"]

[[tool.importlinter.contracts]]
# import-linter has no allowlist contract, so "only tasks.domain" is enforced by
# forbidding the frameworks and every other tasks module (ADR 0011).
name = "Application imports only the domain"
type = "forbidden"
source_modules = ["tasks.application"]
forbidden_modules = [
    "django",
    "rest_framework",
    "celery",
    "tasks.infrastructure",
    "tasks.api",
    "tasks.selectors",
    # Add tasks.models and tasks.admin in the commit that creates them (iteration 2):
    # import-linter rejects forbidden modules that don't exist yet.
]

[[tool.importlinter.contracts]]
# Strictly ordered: tasks.api.wiring (the composition root) imports infrastructure adapters.
name = "Layers: api > infrastructure > application > domain"
type = "layers"
layers = [
    "tasks.api",
    "tasks.infrastructure",
    "tasks.application",
    "tasks.domain",
]
